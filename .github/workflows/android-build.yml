name: Android build

on:
  push:
    branches:
      - main
      - "claude/**"
  pull_request:
    branches:
      - main
  workflow_dispatch:
    inputs:
      build_type:
        description: Build type
        required: true
        default: release
        type: choice
        options:
          - debug
          - release
      flavor:
        description: Product flavor
        required: true
        default: standard
        type: choice
        options:
          - standard
          - oss
      version:
        description: Release version tag (e.g. 1.2.0) — leave blank to use date+SHA
        required: false
        default: ""

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    env:
      BUILD_TYPE: ${{ github.event_name == 'workflow_dispatch' && inputs.build_type || 'release' }}
      FLAVOR: ${{ github.event_name == 'workflow_dispatch' && inputs.flavor || 'standard' }}
      # Only publish a release on pushes to main or on manual dispatch (not on PRs or claude/** branches)
      PUBLISH_RELEASE: ${{ (github.event_name == 'push' && github.ref == 'refs/heads/main') || github.event_name == 'workflow_dispatch' }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Override Gradle daemon JVM (use Temurin instead of JetBrains)
        run: |
          cat > gradle/gradle-daemon-jvm.properties <<'EOF'
          toolchainVersion=21
          EOF

      - name: Make Gradle wrapper executable
        run: chmod +x gradlew

      - name: Setup Gradle cache
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('**/*.gradle.kts', 'gradle/libs.versions.toml', 'gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: |
            gradle-${{ runner.os }}-

      - name: Decode keystore for release builds
        if: env.BUILD_TYPE == 'release'
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 --decode > app/release.keystore
            cat >> local.properties <<EOF
          MYAPP_RELEASE_STORE_FILE=release.keystore
          MYAPP_RELEASE_STORE_PASSWORD=$KEYSTORE_PASSWORD
          MYAPP_RELEASE_KEY_ALIAS=$KEY_ALIAS
          MYAPP_RELEASE_KEY_PASSWORD=$KEY_PASSWORD
          EOF
          fi

      - name: Build APK
        run: |
          if [ "$FLAVOR" = "oss" ]; then
            TASK_FLAVOR="Oss"
          else
            TASK_FLAVOR=""
          fi
          if [ "$BUILD_TYPE" = "release" ]; then
            ./gradlew :app:assemble${TASK_FLAVOR}Release
          else
            ./gradlew :app:assemble${TASK_FLAVOR}Debug
          fi

      - name: Compute release tag and APK name
        id: meta
        run: |
          if [ -n "${{ inputs.version }}" ]; then
            TAG="v${{ inputs.version }}"
          else
            TAG="build-$(date -u +%Y%m%d)-${GITHUB_SHA::8}"
          fi
          APK_NAME="episteme-${TAG}-${FLAVOR}-${BUILD_TYPE}.apk"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "apk_name=$APK_NAME" >> "$GITHUB_OUTPUT"

      - name: Stage APK
        id: stage
        run: |
          APK=$(find app/build/outputs/apk -name "*.apk" | head -1)
          if [ -z "$APK" ]; then echo "No APK found" && exit 1; fi
          cp "$APK" "${{ steps.meta.outputs.apk_name }}"
          echo "apk_path=${{ steps.meta.outputs.apk_name }}" >> "$GITHUB_OUTPUT"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: episteme-${{ env.BUILD_TYPE }}-${{ env.FLAVOR }}-${{ github.sha }}
          path: ${{ steps.stage.outputs.apk_path }}
          retention-days: 30

      - name: Publish GitHub Release
        if: env.PUBLISH_RELEASE == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${{ steps.meta.outputs.tag }}"
          gh release create "$TAG" \
            "${{ steps.stage.outputs.apk_path }}" \
            --title "Episteme ${TAG}" \
            --notes "Built from commit \`${GITHUB_SHA::8}\` — flavor: \`${FLAVOR}\`, build type: \`${BUILD_TYPE}\`" \
            --repo "$GITHUB_REPOSITORY"
