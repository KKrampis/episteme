name: Android build

on:
  push:
    branches:
      - main
      - "claude/**"
  pull_request:
    branches:
      - main
  workflow_dispatch:
    inputs:
      build_type:
        description: Build type
        required: true
        default: debug
        type: choice
        options:
          - debug
          - release
      flavor:
        description: Product flavor
        required: true
        default: standard
        type: choice
        options:
          - standard
          - oss
      publish_release:
        description: Publish to GitHub Releases
        required: true
        default: "false"
        type: choice
        options:
          - "false"
          - "true"
      version:
        description: Release version tag (e.g. 1.0.0) — required when publishing
        required: false
        default: ""

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    env:
      BUILD_TYPE: ${{ github.event_name == 'workflow_dispatch' && inputs.build_type || 'debug' }}
      FLAVOR: ${{ github.event_name == 'workflow_dispatch' && inputs.flavor || 'standard' }}
      PUBLISH_RELEASE: ${{ github.event_name == 'workflow_dispatch' && inputs.publish_release || 'false' }}
      VERSION: ${{ github.event_name == 'workflow_dispatch' && inputs.version || '' }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Override Gradle daemon JVM (use Temurin instead of JetBrains)
        run: |
          cat > gradle/gradle-daemon-jvm.properties <<'EOF'
          toolchainVersion=21
          EOF

      - name: Make Gradle wrapper executable
        run: chmod +x gradlew

      - name: Setup Gradle cache
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('**/*.gradle.kts', 'gradle/libs.versions.toml', 'gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: |
            gradle-${{ runner.os }}-

      - name: Decode keystore for release builds
        if: env.BUILD_TYPE == 'release'
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 --decode > app/release.keystore
            cat >> local.properties <<EOF
          MYAPP_RELEASE_STORE_FILE=release.keystore
          MYAPP_RELEASE_STORE_PASSWORD=$KEYSTORE_PASSWORD
          MYAPP_RELEASE_KEY_ALIAS=$KEY_ALIAS
          MYAPP_RELEASE_KEY_PASSWORD=$KEY_PASSWORD
          EOF
          fi

      - name: Build APK
        run: |
          if [ "$FLAVOR" = "oss" ]; then
            TASK_FLAVOR="Oss"
          else
            TASK_FLAVOR=""
          fi
          if [ "$BUILD_TYPE" = "release" ]; then
            ./gradlew :app:assemble${TASK_FLAVOR}Release
          else
            ./gradlew :app:assemble${TASK_FLAVOR}Debug
          fi

      - name: Stage APK for upload
        id: stage_apk
        run: |
          APK=$(find app/build/outputs/apk -name "*.apk" | head -1)
          if [ -z "$APK" ]; then
            echo "No APK found" && exit 1
          fi
          if [ -n "$VERSION" ]; then
            DEST="episteme-${VERSION}-${FLAVOR}-${BUILD_TYPE}.apk"
          else
            DEST="episteme-${FLAVOR}-${BUILD_TYPE}-${GITHUB_SHA::8}.apk"
          fi
          cp "$APK" "$DEST"
          echo "apk_path=$DEST" >> "$GITHUB_OUTPUT"
          echo "apk_name=$DEST" >> "$GITHUB_OUTPUT"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: episteme-${{ env.BUILD_TYPE }}-${{ env.FLAVOR }}-${{ github.sha }}
          path: ${{ steps.stage_apk.outputs.apk_path }}
          retention-days: 30

      - name: Publish GitHub Release
        if: env.PUBLISH_RELEASE == 'true' && env.VERSION != ''
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="v${VERSION}"
          gh release create "$TAG" \
            "${{ steps.stage_apk.outputs.apk_path }}" \
            --title "Episteme ${VERSION}" \
            --notes "Android APK — flavor: \`${FLAVOR}\`, build type: \`${BUILD_TYPE}\`" \
            --repo "$GITHUB_REPOSITORY"
