name: Android build

on:
  push:
    branches:
      - main
      - "claude/**"
  pull_request:
    branches:
      - main
  workflow_dispatch:
    inputs:
      build_type:
        description: Build type
        required: true
        default: debug
        type: choice
        options:
          - debug
          - release
      flavor:
        description: Product flavor
        required: true
        default: standard
        type: choice
        options:
          - standard
          - oss

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    env:
      BUILD_TYPE: ${{ github.event_name == 'workflow_dispatch' && inputs.build_type || 'debug' }}
      FLAVOR: ${{ github.event_name == 'workflow_dispatch' && inputs.flavor || 'standard' }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Override Gradle daemon JVM (use Temurin instead of JetBrains)
        run: |
          cat > gradle/gradle-daemon-jvm.properties <<'EOF'
          toolchainVersion=21
          EOF

      - name: Make Gradle wrapper executable
        run: chmod +x gradlew

      - name: Setup Gradle cache
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('**/*.gradle.kts', 'gradle/libs.versions.toml', 'gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: |
            gradle-${{ runner.os }}-

      - name: Decode keystore for release builds
        if: env.BUILD_TYPE == 'release'
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 --decode > app/release.keystore
            cat >> local.properties <<EOF
          MYAPP_RELEASE_STORE_FILE=release.keystore
          MYAPP_RELEASE_STORE_PASSWORD=$KEYSTORE_PASSWORD
          MYAPP_RELEASE_KEY_ALIAS=$KEY_ALIAS
          MYAPP_RELEASE_KEY_PASSWORD=$KEY_PASSWORD
          EOF
          fi

      - name: Build APK
        run: |
          if [ "$FLAVOR" = "oss" ]; then
            TASK_FLAVOR="Oss"
          else
            TASK_FLAVOR=""
          fi
          if [ "$BUILD_TYPE" = "release" ]; then
            ./gradlew :app:assemble${TASK_FLAVOR}Release
          else
            ./gradlew :app:assemble${TASK_FLAVOR}Debug
          fi

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: episteme-${{ env.BUILD_TYPE }}-${{ env.FLAVOR }}-${{ github.sha }}
          path: app/build/outputs/apk/**/*.apk
          retention-days: 30
