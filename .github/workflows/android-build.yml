name: Android build

on:
  push:
    branches:
      - main
      - "claude/**"
  pull_request:
    branches:
      - main
  workflow_dispatch:
    inputs:
      build_type:
        description: Build type
        required: true
        default: debug
        type: choice
        options:
          - debug
          - release
      flavor:
        description: Product flavor
        required: true
        default: standard
        type: choice
        options:
          - standard
          - oss

permissions:
  contents: write

jobs:
  build:
    name: Android ${{ github.event_name == 'workflow_dispatch' && inputs.build_type || 'debug' }} (${{ github.event_name == 'workflow_dispatch' && inputs.flavor || 'standard' }})
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Override Gradle daemon JVM (use Temurin instead of JetBrains)
        run: |
          cat > gradle/gradle-daemon-jvm.properties <<'EOF'
          toolchainVersion=21
          EOF

      - name: Make Gradle wrapper executable
        run: chmod +x gradlew

      - name: Setup Gradle cache
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('**/*.gradle.kts', 'gradle/libs.versions.toml', 'gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: |
            gradle-${{ runner.os }}-

      - name: Decode keystore (release only)
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.build_type == 'release' && secrets.ANDROID_KEYSTORE_BASE64 != '' }}
        run: |
          echo "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" | base64 --decode > app/release.keystore
          cat >> local.properties <<EOF
          MYAPP_RELEASE_STORE_FILE=release.keystore
          MYAPP_RELEASE_STORE_PASSWORD=${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          MYAPP_RELEASE_KEY_ALIAS=${{ secrets.ANDROID_KEY_ALIAS }}
          MYAPP_RELEASE_KEY_PASSWORD=${{ secrets.ANDROID_KEY_PASSWORD }}
          EOF

      - name: Build debug APK
        if: ${{ github.event_name != 'workflow_dispatch' || inputs.build_type == 'debug' }}
        run: |
          FLAVOR="${{ github.event_name == 'workflow_dispatch' && inputs.flavor || 'standard' }}"
          if [ "$FLAVOR" = "standard" ]; then
            ./gradlew :app:assembleDebug
          else
            ./gradlew :app:assembleOssDebug
          fi

      - name: Build release APK
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.build_type == 'release' }}
        run: |
          if [ "${{ inputs.flavor }}" = "standard" ]; then
            ./gradlew :app:assembleRelease
          else
            ./gradlew :app:assembleOssRelease
          fi

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: episteme-apk-${{ github.event_name == 'workflow_dispatch' && inputs.build_type || 'debug' }}-${{ github.event_name == 'workflow_dispatch' && inputs.flavor || 'standard' }}-${{ github.sha }}
          path: app/build/outputs/apk/**/*.apk
          retention-days: 30
